# Netlify build configuration.
#
# The Next app lives in web/, which has its own package.json and lockfile —
# this repo has no npm workspaces (see CLAUDE.md) — so `base` points Netlify
# there and both the install and the build run inside it.
#
# `publish` is resolved relative to `base`, so this is web/.next.
#
# It must be set and it must not equal `base`. Left unset it *defaults* to the
# base directory, and the Next.js runtime rejects that outright: "Your publish
# directory cannot be the same as the base directory of your site."
#
# The Netlify UI cannot express this on its own — its Publish directory input
# renders `web/` as a fixed prefix, so clearing the field yields `web`, which
# is exactly the rejected case. Setting it here overrides the UI.
#
# There is no [[plugins]] entry: the Next.js Runtime is attached to the project
# in the Netlify UI (Build settings → Runtime), which keeps it on auto-updates.
# It is NOT installed automatically for a project that was first created as a
# static site — that has to be selected by hand, once.
[build]
  base = "web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Netlify's secret scanner fails a build when it finds the value of any
  # environment variable in the build output. Every NEXT_PUBLIC_* value is
  # *meant* to be in the client bundle — that is what the prefix declares — so
  # left unqualified the scanner fails this deploy every single time.
  #
  # Only the five public keys are exempted here. SANITY_API_READ_TOKEN and
  # RESEND_API_KEY stay scanned, which is the point: if either ever leaks into
  # the bundle, the build should fail loudly.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SANITY_PROJECT_ID,NEXT_PUBLIC_SANITY_DATASET,NEXT_PUBLIC_SANITY_API_VERSION,NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_GA_ID"

  # Turbopack's persistent build cache records the values of the env vars it
  # compiled against, so both real secrets turn up in .next/cache/turbopack/
  # *.sst files. Verified locally: they appear in 10 cache files and in **zero**
  # client-static or server chunks — nothing a browser can reach.
  #
  # Paths are relative to the repo root and match on substring, so the first
  # entry also covers the runtime's .netlify/.next/cache copy. This is scoped
  # to the cache on purpose: omitting the two KEYS instead would silence the
  # scanner everywhere and throw away the protection worth having.
  SECRETS_SCAN_OMIT_PATHS = ".next/cache,.netlify/.next/cache"
